name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 單元測試（不需要真實案件資料）
        run: node test/synthetic.test.mjs
      - name: 建置，且已提交的 product/index.html 必須是最新
        run: |
          node build.mjs
          git diff --exit-code -- product/index.html || { echo "::error::product/index.html 不是最新，請執行 node build.mjs 後一併提交"; exit 1; }
